<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성과 저해 요인 진단</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: #F4F7FA;
  color: #1A2E4A;
  min-height: 100vh;
  padding: 2rem 1rem;
}
.container { max-width: 720px; margin: 0 auto; }

/* 헤더 */
.header {
  background: #E8631A;
  border-radius: 14px;
  padding: 1.75rem 2rem;
  margin-bottom: 1.5rem;
  color: #fff;
}
.header-badge {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  font-size: 13px; font-weight: 700; letter-spacing: 2px;
  padding: 4px 14px; border-radius: 20px; margin-bottom: 10px;
}
.header h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.header p  { font-size: 15px; color: rgba(255,255,255,0.88); line-height: 1.7; }

/* 그룹 */
.group { margin-bottom: 1rem; }
.group-header {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px;
  border-radius: 10px 10px 0 0;
  border-left: 4px solid;
}
.group-title { font-size: 17px; font-weight: 700; }
.group-count {
  margin-left: auto;
  font-size: 24px; font-weight: 700;
  min-width: 38px; text-align: center;
}
.group-count span { font-size: 14px; font-weight: 400; }

/* 문항 */
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: #fff;
  border-left: 4px solid;
  border-bottom: 0.5px solid #E8EDF2;
  cursor: pointer;
  transition: background .12s;
  user-select: none;
}
.item:last-child { border-radius: 0 0 10px 10px; border-bottom: none; }
.item:hover { background: #FAFCFC; }
.item.checked { background: #f8fbfa; }

.checkbox {
  width: 26px; height: 26px;
  border-radius: 7px;
  border: 2px solid #D0DAE8;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 15px; font-weight: 700;
  color: transparent;
  transition: all .12s;
}
.item.checked .checkbox { color: #fff; border-color: transparent; }
.item-text { font-size: 16px; color: #2A3A4A; line-height: 1.55; flex: 1; }
.item.checked .item-text { color: #1A2E4A; font-weight: 500; }

/* 결과 */
.result-card {
  background: #fff;
  border-radius: 14px;
  padding: 1.5rem;
  border: 1px solid #E8EDF2;
  margin-bottom: 1rem;
  display: none;
}
.result-card.show { display: block; }

.result-title { font-size: 17px; font-weight: 700; color: #1A2E4A; margin-bottom: 1rem; }

/* 막대 그래프 */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-label { font-size: 14px; font-weight: 700; width: 84px; flex-shrink: 0; }
.bar-track { flex: 1; height: 8px; background: #E8EDF2; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
.bar-num { font-size: 14px; color: #8A9AB0; width: 30px; text-align: right; flex-shrink: 0; }

/* 1위 유형 강조 */
.top-type {
  border-radius: 12px;
  padding: 1.25rem;
  margin-top: 1rem;
  border: 2px solid;
}
.top-badge {
  display: inline-block;
  font-size: 12px; font-weight: 700;
  padding: 3px 12px; border-radius: 20px; margin-bottom: 8px;
}
.top-name { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
.top-desc { font-size: 15px; line-height: 1.6; margin-bottom: 10px; }
.top-action-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.top-actions { font-size: 14px; line-height: 1.9; }
.top-actions li { list-style: none; padding-left: 16px; position: relative; }
.top-actions li::before { content: "→"; position: absolute; left: 0; }

/* 공동 1위 */
.tie-note { font-size: 14px; color: #8A9AB0; margin-top: 8px; line-height: 1.6; }

/* 리셋 */
.reset-btn {
  width: 100%; padding: 14px;
  border: 1.5px solid #D0DAE8; border-radius: 10px;
  background: #fff; color: #8A9AB0; font-size: 15px;
  cursor: pointer; margin-top: 1rem; transition: all .15s;
}
.reset-btn:hover { background: #F4F7FA; color: #1A2E4A; }

/* 안내 */
.guide-box {
  background: #fff; border-radius: 12px;
  padding: 1.25rem; margin-bottom: 1rem;
  border: 1px solid #E8EDF2;
}
.guide-box p { font-size: 15px; color: #5A6A7A; line-height: 1.75; }
.guide-box strong { color: #E8631A; }

.footer {
  text-align: center; font-size: 11px; color: #B0BAC8;
  margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #E8EDF2;
}

@media (max-width: 480px) {
  .item-text { font-size: 15px; }
  .group-count { font-size: 21px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-badge">워크시트 2</div>
    <h1>성과 저해 요인 체크리스트</h1>
    <p>아래 항목 중 나에게 해당된다고 느끼는 것에 모두 체크하세요.<br>솔직할수록 더 도움이 됩니다.</p>
  </div>

  <div class="guide-box">
    <p>4가지 유형(완벽주의·위임 기피·디지털 분산·자기 과소평가) 중<br>
    <strong>가장 많이 체크된 항목이 나의 주요 저해 요인</strong>입니다.<br>
    체크할수록 결과 그래프가 실시간으로 업데이트됩니다.</p>
  </div>

  <div id="groups-wrap"></div>

  <div class="result-card" id="result-card">
    <div class="result-title">나의 성과 저해 요인 분석</div>
    <div id="bars"></div>
    <div id="top-type"></div>
  </div>

  <button class="reset-btn" onclick="resetAll()">↺ &nbsp;다시 체크하기</button>

  <div class="footer">
    성과관리 × 시간관리 &nbsp;|&nbsp; 워크시트 2 디지털 버전
  </div>
</div>

<script>
const GROUPS = [
  {
    id: "A", label: "완벽주의",
    color: "#E85D3D", bg: "#FFF0EE", lightBg: "#FFF7F5", border: "#F5B8AC",
    items: [
      "결과물을 공유하기 전에 완벽하게 만들려고 시간을 많이 쓴다",
      "작은 실수나 오류가 매우 신경 쓰인다",
      "처음부터 다시 하는 경우가 많다",
      "80% 완성도에서 공유하기가 어렵다",
    ],
    desc: "완성도에 대한 높은 기준이 오히려 속도와 공유를 막고 있습니다. '충분히 좋은 것'을 인정하는 연습이 필요합니다.",
    actions: [
      "초안을 24시간 안에 공유하는 규칙 만들기",
      "80% 완성도에서 피드백 받기 → 수정 루프 단축",
      "실수 일지 쓰기: 대부분의 실수는 큰일이 아님을 확인",
    ]
  },
  {
    id: "B", label: "위임 기피",
    color: "#E8631A", bg: "#FFF5EE", lightBg: "#FFFAF5", border: "#F5C8A8",
    items: [
      "내가 직접 해야 제대로 된다고 느낀다",
      "남에게 맡기면 결과가 걱정된다",
      "위임하고 나서 자꾸 확인하게 된다",
      "혼자 처리하는 것이 더 빠르다고 생각한다",
    ],
    desc: "혼자 모든 것을 처리하려다 보면 정작 중요한 일에 집중할 시간이 사라집니다. 위임은 신뢰이자 협업의 시작입니다.",
    actions: [
      "이번 주 위임 가능한 일 1가지 찾아서 맡겨보기",
      "결과가 아닌 방향만 확인하는 '체크인 규칙' 정하기",
      "위임 후 돌아온 성과를 기록 → 신뢰 데이터 쌓기",
    ]
  },
  {
    id: "C", label: "디지털 분산",
    color: "#2563A8", bg: "#EEF4FF", lightBg: "#F5F8FF", border: "#A8C0E8",
    items: [
      "일하는 중간에 SNS나 메신저를 자주 확인한다",
      "알림이 울리면 즉시 확인하지 않으면 불안하다",
      "집중하려고 해도 30분 이상 유지하기 어렵다",
      "스마트폰을 손에 잡지 않으면 뭔가 불안하다",
    ],
    desc: "디지털 기기의 알림이 집중력을 분산시키고 있습니다. 의도적인 '오프라인 시간'이 생산성의 핵심입니다.",
    actions: [
      "작업 시작 전 핸드폰 뒤집어 놓기 또는 다른 방에 두기",
      "하루 2~3번만 메시지 확인하는 시간대 정하기",
      "집중 작업 시간(Deep Work) 90분 블록 캘린더에 등록",
    ]
  },
  {
    id: "D", label: "자기 과소평가",
    color: "#1E6B5A", bg: "#F0FAF5", lightBg: "#F5FCF8", border: "#A0D8C0",
    items: [
      "내 경험이 실제로 쓸모 있는지 확신이 없다",
      "다른 사람들은 나보다 훨씬 잘하는 것 같다",
      "내가 이룬 것들을 별거 아니라고 여긴다",
      "내 의견이나 아이디어를 먼저 말하기 어렵다",
    ],
    desc: "오랜 경험과 실력을 스스로 저평가하고 있습니다. 객관적인 성과 기록이 자신감 회복의 출발점입니다.",
    actions: [
      "지난 5년간 내가 이룬 것 10가지 적어보기",
      "타인의 피드백이나 칭찬을 파일로 저장해두기",
      "하루 한 가지 의견을 먼저 말하는 연습하기",
    ]
  },
];

// 체크 상태: group별 4개 항목
const checked = { A:[false,false,false,false], B:[false,false,false,false], C:[false,false,false,false], D:[false,false,false,false] };

function countGroup(id){ return checked[id].filter(Boolean).length; }
function totalChecked(){ return Object.values(checked).flat().filter(Boolean).length; }

function renderGroups(){
  document.getElementById('groups-wrap').innerHTML = GROUPS.map(g => {
    const cnt = countGroup(g.id);
    return `
    <div class="group">
      <div class="group-header" style="background:${g.bg};border-left-color:${g.color};border-radius:10px 10px 0 0">
        <span class="group-title" style="color:${g.color}">▶ ${g.label}</span>
        <span class="group-count" style="color:${g.color}">${cnt}<span>/4</span></span>
      </div>
      ${g.items.map((q,i) => `
        <div class="item${checked[g.id][i]?' checked':''}" style="border-left-color:${checked[g.id][i]?g.color:'#E8EDF2'}" onclick="toggle('${g.id}',${i})">
          <div class="checkbox" style="${checked[g.id][i]?'background:'+g.color:''}">✓</div>
          <span class="item-text">${q}</span>
        </div>`).join('')}
    </div>`;
  }).join('');
}

function renderResult(){
  const total = totalChecked();
  const card = document.getElementById('result-card');
  if(total === 0){ card.classList.remove('show'); return; }
  card.classList.add('show');

  const counts = GROUPS.map(g => ({ ...g, cnt: countGroup(g.id) }));
  const max = Math.max(...counts.map(g => g.cnt));

  // 막대 그래프
  document.getElementById('bars').innerHTML = counts.map(g => `
    <div class="bar-row">
      <span class="bar-label" style="color:${g.color}">${g.label}</span>
      <div class="bar-track">
        <div class="bar-fill" style="width:${g.cnt/4*100}%;background:${g.color}"></div>
      </div>
      <span class="bar-num">${g.cnt}/4</span>
    </div>`).join('');

  // 1위 유형
  if(max === 0){ document.getElementById('top-type').innerHTML=''; return; }
  const tops = counts.filter(g => g.cnt === max);
  const topWrap = document.getElementById('top-type');

  if(tops.length === 1){
    const t = tops[0];
    topWrap.innerHTML = `
      <div class="top-type" style="background:${t.bg};border-color:${t.color}">
        <span class="top-badge" style="background:${t.color};color:#fff">주요 저해 요인</span>
        <div class="top-name" style="color:${t.color}">${t.label}</div>
        <div class="top-desc" style="color:#3A4A5A">${t.desc}</div>
        <div class="top-action-title" style="color:${t.color}">이렇게 개선해보세요</div>
        <ul class="top-actions" style="color:#3A4A5A">
          ${t.actions.map(a=>`<li>${a}</li>`).join('')}
        </ul>
      </div>`;
  } else {
    // 공동 1위
    topWrap.innerHTML = tops.map(t => `
      <div class="top-type" style="background:${t.bg};border-color:${t.color};margin-bottom:8px">
        <span class="top-badge" style="background:${t.color};color:#fff">공동 1위</span>
        <div class="top-name" style="color:${t.color}">${t.label}</div>
        <div class="top-desc" style="color:#3A4A5A">${t.desc}</div>
        <div class="top-action-title" style="color:${t.color}">이렇게 개선해보세요</div>
        <ul class="top-actions" style="color:#3A4A5A">
          ${t.actions.map(a=>`<li>${a}</li>`).join('')}
        </ul>
      </div>`).join('') +
      `<p class="tie-note">두 가지 영역이 동점입니다. 먼저 일상에서 더 자주 느끼는 것부터 개선해보세요.</p>`;
  }
}

function toggle(id, i){
  checked[id][i] = !checked[id][i];
  renderGroups();
  renderResult();
}

function resetAll(){
  Object.keys(checked).forEach(k => checked[k].fill(false));
  renderGroups();
  renderResult();
  window.scrollTo({top:0, behavior:'smooth'});
}

renderGroups();
renderResult();
</script>
</body>
</html>
